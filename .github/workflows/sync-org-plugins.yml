name: Sync org plugins

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-org-plugins
  cancel-in-progress: false

jobs:
  sync:
    name: Discover and publish org plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Discover org plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./cmd/gqy-plugin sync-org \
            --org GQYTeam \
            --registry registry.json \
            --json | tee /tmp/sync-result.json
          {
            echo '## 组织插件同步'
            echo
            echo '```json'
            cat /tmp/sync-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- registry.json; then
            echo 'registry.json 无变化。'
            exit 0
          fi
          go run ./cmd/gqy-plugin verify --registry registry.json --strict
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry.json
          git commit -m 'chore: 自动收录组织内插件'
          git push origin main
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
